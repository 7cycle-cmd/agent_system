<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mouse Spot Helper — Settings</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app" style="max-width: 560px;">
    <div class="panel" style="text-align: left;">
      <h1 style="text-align: center;">Settings</h1>
      <div id="targetList"></div>
      <div style="background:#1e1e1e; border-radius:8px; padding:1em; margin-top:1em;">
        <label style="display:block; margin:0.4em 0 0.2em; color:#aaa; font-size:0.9em;">Name *</label>
        <input type="text" id="newName" placeholder="New target name" style="width:100%; padding:0.5em;">
        <label style="display:block; margin:0.4em 0 0.2em; color:#aaa; font-size:0.9em;">Action *</label>
        <input type="text" id="newAction" value="click" placeholder="click" style="width:100%; padding:0.5em;">
        <div style="display:flex; gap:0.75em;">
          <div style="flex:1">
            <label style="display:block; margin:0.4em 0 0.2em; color:#aaa; font-size:0.9em;">X</label>
            <input type="number" id="newX" placeholder="optional" style="width:100%; padding:0.5em;">
          </div>
          <div style="flex:1">
            <label style="display:block; margin:0.4em 0 0.2em; color:#aaa; font-size:0.9em;">Y</label>
            <input type="number" id="newY" placeholder="optional" style="width:100%; padding:0.5em;">
          </div>
        </div>
        <div style="display:flex; gap:0.5em; margin-top:0.8em;">
          <button id="addBtn">+ Add</button>
        </div>
      </div>
      <div style="text-align: center; margin-top: 1em;">
        <button class="secondary" onclick="window.close()">Close</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/settings.js"></script>
</body>
</html>
